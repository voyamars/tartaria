  <header class="rt-top"><a href="index.html#expeditions">All expeditions</a><a class="rt-logo" href="index.html" aria-label="Tartaria XP"><svg viewBox="49 189 1335 708" aria-hidden="true"><use href="#logoArt" /></svg></a></header>
  <main id="rt"></main>

  <div class="rt-modal" id="rtM" hidden>
    <form id="rtF" novalidate>
      <button type="button" class="rt-x" id="rtX" aria-label="Close">×</button>
      <h3 id="rtH"></h3><small id="rtS"></small>
      <label class="field"><span>Name</span><input type="text" id="fName" autocomplete="name" /></label>
      <label class="field"><span>Direct Contact (Phone / Email)</span><input type="text" id="fContact" /></label>
      <label class="field"><span>Proposed Dates</span><textarea id="fDates" rows="2"></textarea></label>
      <p class="qerr" id="rtE" role="alert"></p>
      <button type="submit" class="luxury-button qform-btn"><span>Send via WhatsApp</span><b aria-hidden="true">↗</b></button>
    </form>
  </div>

  <footer class="footer">
    <div class="container">
      <p class="footer__statement">TARTARIA XP — ARCHITECTING LEGACIES SINCE 2021.</p>
      <p class="footer__sub">Beyond the map. Into the myth.</p>
      <span class="gold-rule" aria-hidden="true"></span>
      <p class="footer__copy">© 2026 Tartaria XP Experiences. All intellectual property, itineraries, and conceptual frameworks are strictly confidential. Founder-Led Immersive Operations.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="routes.js"></script>
  <script>
  (() => {
    "use strict";
    const R = window.ROUTES, $ = (id) => document.getElementById(id);
    const n = Math.min(R.length, Math.max(1, parseInt(new URLSearchParams(location.search).get("r"), 10) || 1));
    const r = R[n - 1], num = "0" + n;
    document.title = `${r.t} — Tartaria XP`;

    // geometric seal: one star with (route number + 4) points, drawn by stroke reveal
    const star = (k, a, b) => { let d = ""; for (let j = 0; j < k * 2; j++) { const t = Math.PI * j / k - Math.PI / 2, rr = j % 2 ? b : a; d += (j ? "L" : "M") + (100 + Math.cos(t) * rr).toFixed(1) + " " + (100 + Math.sin(t) * rr).toFixed(1); } return d + "Z"; };
    const k = n + 4;
    const seal = `<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="draw" cx="100" cy="100" r="94" pathLength="1"/><circle class="draw" cx="100" cy="100" r="66" pathLength="1"/><path class="draw" pathLength="1" d="${star(k, 90, 48)}"/><path class="draw" pathLength="1" d="${star(k, 60, 30)}" transform="rotate(${180 / k} 100 100)"/><circle cx="100" cy="100" r="2.5" fill="currentColor"/></svg>`;

    const priv = r.v.map((x) => { const i = x.indexOf(": "), b = i > 0 && i < 34; return `<li>${b ? `<b>${x.slice(0, i)}</b>` : ""}${b ? x.slice(i + 2) : x}</li>`; }).join("");
    const prev = R[(n + R.length - 2) % R.length], next = R[n % R.length];

    $("rt").innerHTML = `
      <section class="container rt-hero">
        <div>
          <span class="kicker">ROUTE ${num}</span>
          <h1>${r.t}</h1>
          ${r.s ? `<p class="rt-sub">${r.s}</p>` : ""}
          <p class="rt-lead">${r.h}</p>
          <div class="rt-actions">
            <button class="luxury-button" data-open="${r.a}"><span>${r.a}</span><b aria-hidden="true">↗</b></button>
          </div>
        </div>
        <figure class="rt-seal">${seal}<figcaption>${r.m}</figcaption></figure>
      </section>
      <div class="container">
        <section class="rt-sec"><ol class="rt-path">${r.p.split(" → ").map((s) => `<li>${s}</li>`).join("")}</ol></section>
        ${r.c ? `<section class="rt-sec"><span class="kicker">THE EXPEDITION</span><h2>Access over itinerary</h2><p>${r.c}</p></section>` : ""}
        ${r.nr ? `<section class="rt-sec"><span class="kicker">NARRATIVE CONCEPT</span><h2>You move as an envoy</h2><p>${r.nr}</p></section>` : ""}
        <section class="rt-sec"><ul class="rt-priv">${priv}</ul></section>
        <nav class="rt-nav" aria-label="Expedition navigation"><a href="route.html?r=${prev.i}"><i aria-hidden="true">←</i>Prev</a><span>${num} / 0${R.length}</span><a href="route.html?r=${next.i}">Next<i aria-hidden="true">→</i></a></nav>
      </div>`;

    if (window.gsap && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      gsap.fromTo(".draw", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 2.6, stagger: 0.3, ease: "power2.inOut", clearProps: "strokeDasharray" });
      gsap.from([".rt-hero .kicker", ".rt-hero h1", ".rt-sub", ".rt-lead", ".rt-actions"], { opacity: 0, y: 24, duration: 1, stagger: 0.12, ease: "power3.out" });
      gsap.from(".rt-path li", { opacity: 0, x: -14, duration: 0.7, stagger: 0.15, delay: 0.6 });
    }

    // contact overlay → WhatsApp
    let intent = "";
    const M = $("rtM");
    document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => {
      intent = b.dataset.open;
      $("rtH").textContent = intent;
      $("rtS").textContent = `Route ${num} — ${r.t}`;
      M.hidden = false; $("fName").focus();
    }));
    const close = () => (M.hidden = true);
    $("rtX").addEventListener("click", close);
    M.addEventListener("click", (e) => e.target === M && close());
    addEventListener("keydown", (e) => e.key === "Escape" && close());
    $("rtF").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("fName").value.trim(), contact = $("fContact").value.trim(), dates = $("fDates").value.trim() || "Flexible";
      $("fName").parentNode.classList.toggle("is-invalid", !name);
      $("fContact").parentNode.classList.toggle("is-invalid", !contact);
      $("rtE").textContent = name && contact ? "" : "Please provide your name and a direct contact.";
      if (!name || !contact) return;
      const msg = ["Greetings Tartaria XP Concierge.", "", `Request: ${intent}`, `Route ${num} // ${r.t}`, `Client Name: ${name}`, `Contact Info: ${contact}`, `Proposed Dates: ${dates}`].join("\n");
      window.open(`https://wa.me/${WA_PHONE}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
    });
  })();
  </script>
