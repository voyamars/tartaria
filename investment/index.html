<html lang="en">

<meta name="theme-color" content="#060608" />
<meta name="robots" content="noindex, nofollow" />
<title>TARTARIA XP — Restricted</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#060608;--gold:#D4AF37;--warm:#F3E5AB;--ruby:#7A1515;--text:#F4F1ED;--mut:rgba(244,241,237,.68);--ease:cubic-bezier(.25,1,.5,1);--serif:'Cinzel',serif;--sans:'Montserrat',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 16px/1.75 var(--sans);-webkit-font-smoothing:antialiased}
.k{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:26px;font:600 .7rem/1.5 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.k::before{content:"";width:30px;height:1px;background:var(--gold)}
.ruby{display:inline-flex;align-items:center;gap:14px;padding:19px 34px;border:1px solid rgba(212,175,55,.5);background:linear-gradient(135deg,rgba(122,21,21,.9),rgba(59,8,8,.95));color:var(--text);font:600 .72rem var(--sans);letter-spacing:.2em;text-transform:uppercase;transition:transform .45s var(--ease),box-shadow .45s}
.ruby:hover,.ruby:focus-visible{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.45);outline:0}
.ruby[disabled]{opacity:.6;cursor:default}
.ar{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4}
/* gate */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse 70% 55% at 50% -5%,rgba(122,21,21,.3),transparent 66%),radial-gradient(ellipse 55% 50% at 15% 105%,rgba(212,175,55,.12),transparent 68%),#060608;transition:opacity 1.2s var(--ease),visibility 1.2s}
.gate.out{opacity:0;visibility:hidden}
.gate::before{content:"";position:absolute;width:min(820px,90vw);aspect-ratio:1;border:1px solid rgba(212,175,55,.1);border-radius:50%;box-shadow:0 0 0 90px rgba(255,255,255,.01),0 0 0 180px rgba(122,21,21,.04);animation:orb 12s ease-in-out infinite alternate}
@keyframes orb{from{transform:scale(.94) rotate(-3deg)}to{transform:scale(1.04) rotate(3deg)}}
.pn{position:relative;width:min(520px,100%);padding:clamp(34px,6vw,58px);text-align:center;border:1px solid rgba(255,255,255,.1);background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015));backdrop-filter:blur(24px);box-shadow:0 34px 90px rgba(0,0,0,.6);opacity:0;transform:translateY(26px);transition:opacity 1.1s var(--ease) .15s,transform 1.1s var(--ease) .15s}
.gate.in .pn{opacity:1;transform:none}.pn::before{content:"";position:absolute;top:0;left:50%;width:120px;height:2px;translate:-50% 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.pn .mk{width:56px;height:56px;margin:0 auto 26px;display:grid;place-items:center;border:1px solid rgba(212,175,55,.35);border-radius:50%;font:600 .72rem var(--serif);letter-spacing:.08em;color:var(--warm)}
.pn h1{font:500 clamp(1.7rem,4.6vw,2.6rem)/1.2 var(--serif);margin:14px 0 16px}.pn p{max-width:360px;margin:0 auto 28px;color:var(--mut);font-size:.95rem}
.pn input{width:100%;height:62px;margin-bottom:14px;text-align:center;font:600 1.3rem var(--serif);letter-spacing:.5em;padding-left:.5em;color:var(--text);background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14);outline:0;caret-color:var(--gold);transition:border-color .35s,box-shadow .35s}
.pn input:focus{border-color:rgba(212,175,55,.6);box-shadow:0 0 0 4px rgba(212,175,55,.06)}
.pn button{width:100%;cursor:pointer;justify-content:center}.pn small{display:block;min-height:22px;margin-top:14px;font-size:.78rem;color:rgba(244,241,237,.5);transition:color .3s}
.pn.err input{border-color:rgba(226,94,94,.75);animation:sh .46s}.pn.err small{color:#e58b8b}.pn.ok input{border-color:var(--gold)}.pn.ok small{color:var(--warm)}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

</style>
</head>
<body>
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gt">
  <form class="pn" id="pn" novalidate>
    <div class="mk" aria-hidden="true">TXP</div>
    <span class="k">Private Investment Portfolio</span>
    <h1 id="gt">Welcome to<br>the private space</h1>
    <p>Enter your personal access code to open the TARTARIA XP investment portfolio.</p>
    <input id="code" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="64" placeholder="••••" aria-label="Access code" />
    <button class="ruby" type="submit" id="go">Open portfolio <span class="ard" aria-hidden="true"><svg class="ar" viewBox="0 0 16 16" focusable="false"><path d="M2.5 8h10.5M9 4l4 4-4 4"/></svg></span></button>
    <small id="st" aria-live="polite">Access is granted by personal code</small>
  </form>
</div>

<noscript><p style="position:fixed;inset:auto 0 24px;text-align:center;color:#999;font-size:.8rem;z-index:101">JavaScript is required to open this page.</p></noscript>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const vault = $("vault"), gate = $("gate"), pn = $("pn"), inp = $("code"), st = $("st"), go = $("go");
  const KEY = "txp_inv_k2";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const bin = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const data = bin(vault.textContent.trim()), salt = bin(vault.dataset.salt), iv = bin(vault.dataset.iv), iter = +vault.dataset.iter;

  const keyFromCode = async (code) => {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  };
  const open = async (key) => {                       // throws when the key is wrong (GCM authentication fails)
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  };
  const remember = async (key) => {                   // per-tab only: a reload keeps access, closing the tab ends it
    try { sessionStorage.setItem(KEY, btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))))); } catch (e) {}
  };
  const say = (t, cls) => { pn.classList.remove("err", "ok"); void pn.offsetWidth; if (cls) pn.classList.add(cls); st.textContent = t; };

  const boot = async () => {
    if (!(window.crypto && crypto.subtle)) { inp.disabled = go.disabled = true; say("A secure connection (https) is required.", "err"); return; }
    let saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
    if (saved) {
      try { return await open(await crypto.subtle.importKey("raw", bin(saved), "AES-GCM", false, ["decrypt"])); }
      catch (e) { try { sessionStorage.removeItem(KEY); } catch (x) {} }
    }
    requestAnimationFrame(() => { gate.classList.add("in"); setTimeout(() => inp.focus({ preventScroll: true }), reduced ? 0 : 700); });
  };

  let fails = 0, until = 0;
  inp.addEventListener("input", () => { if (pn.classList.contains("err")) say("Access is granted by personal code", ""); });
  pn.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!inp.value) return;
    const wait = until - Date.now();
    if (wait > 0) return say("Too many attempts. Please wait " + Math.ceil(wait / 1000) + " s.", "err");
    inp.disabled = go.disabled = true; say("Verifying…", "");
    try {
      const key = await keyFromCode(inp.value);
      await remember(key);
      say("Access confirmed. Opening the portfolio…", "ok");
      await new Promise((r) => setTimeout(r, reduced ? 0 : 450));
      await open(key);
    } catch (err) {
      try { sessionStorage.removeItem(KEY); } catch (x) {}
      if (++fails >= 5) { until = Date.now() + 30000; fails = 0; }
      inp.disabled = go.disabled = false; inp.value = "";
      say("Code not recognised. Please check and try again.", "err"); inp.focus();
    }
  });
  boot();
})();
</script>
